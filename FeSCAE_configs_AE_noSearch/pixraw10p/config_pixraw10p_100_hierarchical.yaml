clustering:
  cluster_on_correlation: true
  number_of_clusters: 100
  parameters:
    distance_metric: euclidean
    linkage_method: average
  range_n_clusters: 0
  strategy: Hierarchical
dataset:
  input_folder: data/
  label_column: label_pixraw10p
  name: pixraw10P
  scaler: standard
filters:
  autoencoder_parameters:
    AE_name: LinearAE
    epochs: 100
    lr: 0.001
    n_layers: 2
  filter_type: AE
  medoid_parameters:
    distance_metric: euclidean
output:
  logs_folder: Model_results/FeSCAE_noSearch/results_FeSCAE_pixraw10p/output_pixraw10p_100_hierarchical
  output_folder: Model_results/FeSCAE_noSearch/results_FeSCAE_pixraw10p/output_pixraw10p_100_hierarchical
