clustering:
  cluster_on_correlation: true
  number_of_clusters: 90
  parameters:
    metric_type: euclidean
  range_n_clusters: 0
  strategy: KMeans
dataset:
  input_folder: data/
  label_column: label_smk_can_187
  name: SMK-CAN-187
  scaler: standard
filters:
  autoencoder_parameters:
    AE_name: LinearAE
    epochs: 100
    lr: 0.001
    n_layers: 2
  filter_type: Medoid
  medoid_parameters:
    distance_metric: euclidean
output:
  logs_folder: Model_results/FeSCMD_noSearch/results_FeSCMD_smkcan187/output_smkcan187_90_kmeans
  output_folder: Model_results/FeSCMD_noSearch/results_FeSCMD_smkcan187/output_smkcan187_90_kmeans
