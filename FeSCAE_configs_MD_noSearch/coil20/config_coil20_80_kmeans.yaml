clustering:
  cluster_on_correlation: true
  number_of_clusters: 80
  parameters:
    metric_type: euclidean
  range_n_clusters: 0
  strategy: KMeans
dataset:
  input_folder: data/
  label_column: label_coil20
  name: COIL20
  scaler: standard
filters:
  autoencoder_parameters:
    AE_name: LinearAE
    epochs: 100
    lr: 0.001
    n_layers: 2
  filter_type: Medoid
  medoid_parameters:
    distance_metric: euclidean
output:
  logs_folder: Model_results/FeSCMD_noSearch/results_FeSCMD_coil20/output_coil20_80_kmeans
  output_folder: Model_results/FeSCMD_noSearch/results_FeSCMD_coil20/output_coil20_80_kmeans
