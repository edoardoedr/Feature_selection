clustering:
  cluster_on_correlation: true
  number_of_clusters: 70
  parameters: searching
  range_n_clusters: 0
  strategy: KMeans
dataset:
  input_folder: Raw_Datasets/
  label_column: label_tox171
  name: TOX-171
  scaler: standard
filters:
  autoencoder_parameters:
    AE_name: LinearAE
    epochs: 100
    lr: 0.001
    n_layers:
    - 1
    - 2
    - 3
    - 4
  filter_type: AE
  medoid_parameters:
    distance_metric: euclidean
output:
  logs_folder: output_experiments/tox171/output_tox171_70_kmeans
  output_folder: output_experiments/tox171/output_tox171_70_kmeans
